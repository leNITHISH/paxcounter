<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>PaxCounter Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      font-family: 'JetBrains Mono', monospace;
      background: #0f0f0f;
      color: #eee;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    h1 {
      color: #00e0ff;
      margin-top: 30px;
    }
    .dashboard {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 20px;
      flex-wrap: wrap;
    }
    .card {
      background: #1a1a1a;
      border-radius: 10px;
      padding: 20px;
      box-shadow: 0 0 15px rgba(0, 224, 255, 0.1);
      text-align: center;
      width: 220px;
      transition: transform 0.2s ease;
    }
    .card:hover {
      transform: translateY(-4px);
    }
    .card h2 {
      margin: 0;
      color: #00e0ff;
      font-size: 1rem;
    }
    .card p {
      font-size: 2.5rem;
      margin: 8px 0 0 0;
      color: #fff;
    }
    table {
      width: 90%;
      border-collapse: collapse;
      margin: 30px auto;
      font-size: 14px;
    }
    th, td {
      padding: 8px 10px;
      border-bottom: 1px solid #222;
      text-align: left;
    }
    th { background: #1e1e1e; }
    tr:hover { background: #1b1b1b; }
    .rssi { font-weight: bold; }
    #showMoreBtn {
      background: #00e0ff;
      border: none;
      color: #000;
      font-weight: bold;
      margin-top: 10px;
      padding: 8px 12px;
      cursor: pointer;
      border-radius: 4px;
      transition: background 0.2s;
    }
    #showMoreBtn:hover {
      background: #00aacc;
    }
    canvas {
      width: 100%;
      height: 150px;
    }
  </style>
</head>
<body>
  <h1>PaxCounter Dashboard</h1>

  <div class="dashboard">
    <div class="card">
      <h2>Active Devices</h2>
      <p id="active">0</p>
    </div>
    <div class="card">
      <h2>Channel Distribution</h2>
      <canvas id="channelChart"></canvas>
    </div>
  </div>

  <table>
    <thead>
      <tr>
        <th>MAC</th>
        <th>Vendor</th>
        <th>RSSI</th>
        <th>Channel</th>
        <th>Last Seen (s)</th>
      </tr>
    </thead>
    <tbody id="tableBody"></tbody>
  </table>

  <button id="showMoreBtn" style="display:none;">Show More</button>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const tbody = document.getElementById("tableBody");
    const active = document.getElementById("active");
    const showMoreBtn = document.getElementById("showMoreBtn");

    let allDevices = [];
    let showingAll = false;
    const PAGE_SIZE = 10;

    // chart.js setup
    const ctx = document.getElementById('channelChart').getContext('2d');
    const channelChart = new Chart(ctx, {
      type: 'bar',
      data: {
        labels: Array.from({length: 11}, (_, i) => i + 1),
        datasets: [{
          label: 'Devices per Channel',
          data: Array(11).fill(0),
          backgroundColor: '#00e0ff',
        }]
      },
      options: {
        plugins: { legend: { display: false } },
        scales: {
          x: {
            title: { display: true, text: 'Wi-Fi Channel', color: '#aaa' },
            ticks: { color: '#ddd' },
            grid: { color: '#222' }
          },
          y: {
            beginAtZero: true,
            title: { display: true, text: 'Device Count', color: '#aaa' },
            ticks: { color: '#ddd' },
            grid: { color: '#222' }
          }
        }
      }
    });

    function colorForRSSI(rssi) {
      if (rssi >= -50) return "#00ff00";
      if (rssi >= -65) return "#a0ff00";
      if (rssi >= -75) return "#ffaa00";
      if (rssi >= -85) return "#ff5500";
      return "#ff0000";
    }

    function renderTable() {
      const dataToShow = showingAll ? allDevices : allDevices.slice(0, PAGE_SIZE);
      tbody.innerHTML = dataToShow.map(d => `
        <tr>
          <td>${d.mac}</td>
          <td>${d.vendor}</td>
          <td class="rssi" style="color:${colorForRSSI(d.rssi)}">${d.rssi}</td>
          <td>${d.ch}</td>
          <td>${d.lastSeen}</td>
        </tr>
      `).join("");

      if (allDevices.length > PAGE_SIZE) {
        showMoreBtn.style.display = "block";
        showMoreBtn.textContent = showingAll ? "Show Less" : "Show More";
      } else {
        showMoreBtn.style.display = "none";
      }
    }

    function updateChannelChart() {
      const counts = Array(11).fill(0);
      allDevices.forEach(d => {
        if (d.ch >= 1 && d.ch <= 11) counts[d.ch - 1]++;
      });
      channelChart.data.datasets[0].data = counts;
      channelChart.update();
    }

    socket.on("paxdata", (data) => {
      active.textContent = data.active || 0;
      allDevices = data.devices;
      renderTable();
      updateChannelChart();
    });

    showMoreBtn.addEventListener("click", () => {
      showingAll = !showingAll;
      renderTable();
    });
  </script>
</body>
</html>
