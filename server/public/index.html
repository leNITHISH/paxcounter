<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Paxcounter</title>
  
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- Socket.IO client -->
  <script src="/socket.io/socket.io.js"></script>
  
  <!-- Styles -->
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Paxcounter</h1>
      <div class="controls">
        <button id="themeToggle" class="theme-toggle">
          <span>☀️</span> Dark Mode
        </button>
        <div class="table-actions">
          <button id="pauseBtn" class="btn small">Pause</button>
          <button id="exportCsv" class="btn small ghost">Export CSV</button>
          <button id="clearHistory" class="btn small warn">Clear</button>
        </div>
      </div>
    </header>

    <section class="top">
      <div class="card count-card">
        <div class="label">Active Devices</div>
        <div id="deviceCount" class="count">0</div>
        <div class="sub" id="lastUpdate">—</div>
      </div>

      <div class="card chart-card">
        <div class="chart-header">
          <div class="title">2.4GHz Channel Spectrum</div>
          <div class="subtitle">channels 1–11</div>
        </div>
        <div class="chart-wrap">
          <canvas id="channelCountChart"></canvas>
        </div>
      </div>
    </section>

    <div class="card panel">
      <div class="table-top">
        <div class="search">
          <input id="search" placeholder="Search MAC or vendor (press / to focus)" />
          <select id="sortBy" title="Sort">
            <option value="rssi-desc">RSSI (strong→weak)</option>
            <option value="rssi-asc">RSSI (weak→strong)</option>
            <option value="lastSeen-asc">Last seen (old→new)</option>
            <option value="lastSeen-desc">Last seen (new→old)</option>
          </select>
        </div>

        <div class="table-info">
          <div>Showing <span id="shownCount">0</span> / <span id="totalCount">0</span></div>
          <button id="showMoreBtn" class="btn small" style="display:none">Show More</button>
        </div>
      </div>

      <table>
        <thead>
          <tr>
            <th>MAC</th>
            <th>Vendor</th>
            <th>RSSI</th>
            <th>Channel</th>
            <th>Last seen (s)</th>
          </tr>
        </thead>
        <tbody id="tbody">
          <tr>
            <td colspan="5" class="loading">Waiting for device data...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- Application Script -->
  <script src="/app.js"></script>
</body>
</html>
